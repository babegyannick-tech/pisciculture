round:white;color:var(--ink);min-width:0}.field textarea{min-height:80px;resize:vertical}.sectiontitle{font-size:14px;font-weight:750;margin:18px 0 10px}.progress{height:8px;background:#e7eee9;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2);border-radius:99px}.step{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}.check{width:23px;height:23px;border-radius:7px;border:1.5px solid #afc4b7;display:grid;place-items:center;flex-shrink:0;color:white}.check.done{background:var(--green);border-color:var(--green)}.stepmain{flex:1}.stepmain strong{display:block;font-size:14px}.stepmain p{margin:4px 0 0;font-size:12px;color:var(--muted)}.badge{font-size:11px;border-radius:6px;background:#edf3ef;padding:4px 7px}.money{font-variant-numeric:tabular-nums}.barrow{display:grid;grid-template-columns:120px 1fr 88px;gap:10px;align-items:center;font-size:12px;margin:13px 0}.bar{height:8px;background:#edf2ef;border-radius:99px;overflow:hidden}.bar span{height:100%;display:block;background:var(--green2)}.hidden{display:none!important}.footnote{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:20px;right:20px;background:#163d2e;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:9;display:none}.mobilemenu{display:none}

<main class="main">
<header class="topbar"><button class="mobilemenu" id="menuBtn" aria-label="Menu" onclick="toggleMenu()">☰</button><div style="flex:1;min-width:0"><h1 id="topTitle">Tableau de bord</h1><p>Projet piscicole • Ahoué, Côte d'Ivoire • Montants en FCFA</p></div><div class="status" id="storageStatus">● Stockage local</div></header>

<script>
const KEY='piscicultureAhoue_v1';
const defaultState={
 config:{name:'Pisciculture Ahoué',owner:'Propriétaire',budget:250000,currency:'FCFA',feedPrice:0,startDate:new Date().toISOString().slice(0,10),notes:'Deux étangs en terre de 200 m². Profondeur estimée : 1 à 1,5 m. Plusieurs espèces sauvages présentes.'},
 siteChecks:{pondType:'Inconnu',waterSource:'Inconnue',drainage:'À vérifier',waterControl:'À vérifier',inlet:'À vérifier',outlet:'À vérifier',overflow:'À vérifier',dikes:'À vérifier',leaks:'À vérifier',floodRisk:'À vérifier',access:'À vérifier',pondConnection:'À vérifier',notes:''},
 ponds:[
 {id:'A',name:'Étang A',area:200,depth:1.25,stockMin:100,stockMax:300,stockEstimate:200,species:'Plusieurs espèces sauvages',status:'Diagnostic à réaliser',notes:'Stock estimé entre 100 et 300 poissons.'},
 {id:'B',name:'Étang B',area:200,depth:1.25,stockMin:0,stockMax:99,stockEstimate:50,species:'Plusieurs espèces sauvages',status:'Diagnostic à réaliser',notes:'Stock estimé à moins de 100 poissons.'}
 ],
 steps:[
 {title:'Inspecter les digues et les ouvrages d’eau',desc:'Repérer fuites, érosion, entrées/sorties, trop-plein et risques de débordement (priorité inspirée de la FAO).',done:false},
 {title:'Identifier les espèces présentes',desc:'Prendre des photos et demander confirmation à un technicien si nécessaire.',done:false},
 {title:'Faire une pêche d’échantillonnage',desc:'Deux passages comparables par étang, sans vider les bassins.',done:false},
 {title:'Peser et mesurer les poissons',desc:'Noter espèce, longueur et poids sur un échantillon représentatif.',done:false},
 {title:'Contrôler la qualité de l’eau',desc:'Mesurer pH et, si possible, oxygène dissous et température.',done:false},
 {title:'Valider la ration alimentaire',desc:'Choisir un aliment adapté à l’espèce et à la biomasse estimée.',done:false},
 {title:'Suivre les coûts et la croissance',desc:'Enregistrer chaque dépense, ration, mortalité et pesée.',done:false},
 {title:'Préparer la commercialisation',desc:'Contacter des acheteurs et relever les prix locaux avant récolte.',done:false}
 ],
 samples:[],feedings:[],water:[],mortalities:[],expenses:[],stockItems:[],harvests:[],sales:[],clients:[],groups:[],daily:{},agro:{},lastBackup:null,weekly:{start:'',done:{},cp:{}}
};
let state=load();
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000)}
function migrate(s){
 ['samples','feedings','water','mortalities','expenses','stockItems','harvests','sales','clients','groups','ponds','steps'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=structuredClone(defaultState[k])});
 if(!s.daily||typeof s.daily!=='object'||Array.isArray(s.daily))s.daily={};
 if(!s.agro||typeof s.agro!=='object'||Array.isArray(s.agro))s.agro={};
 if(!s.weekly||typeof s.weekly!=='object')s.weekly={};s.weekly={start:s.weekly.start||'',done:s.weekly.done||{},cp:s.weekly.cp||{}};
 s.sales.forEach(x=>{if(!Array.isArray(x.payments)){let p=Number(x.paid)||0;x.payments=p>0?[{id:uid(),date:x.date,amount:p,method:'',note:'Encaissement initial'}]:[]}delete x.paid});
 return s}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object'){return migrate({...structuredClone(defaultState),...s,config:{...defaultState.config,...s.config}})}}catch(e){}return structuredClone(defaultState)}
function persist(){try{if(!state.siteChecks)state.siteChecks=structuredClone(defaultState.siteChecks);localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('storageStatus').textContent='● Sauvegardé sur cet appareil';}catch(e){document.getElementById('storageStatus').textContent='⚠ Stockage indisponible';}}
function save(){persist();render()}
function lastBackupText(){if(!state.lastBackup)return 'jamais';let d=state.lastBackup.slice(0,10),n=daysBetween(d,dateNow());return d+(n===0?' (aujourd’hui)':' (il y a '+n+' j)')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(n){return (Number(n)||0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' FCFA'}
function num(n){return Number(n)||0}
function dateNow(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(arr,key){return arr.reduce((a,x)=>a+num(x[key]),0)}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}
const titles={dashboard:'Tableau de bord',steps:'Parcours du projet',ponds:'Étangs & poissons',site:'Diagnostic des ouvrages (FAO)',guide:'Guide technique Agrodok 15',sampling:'Échantillonnages',feeding:'Alimentation',water:'Qualité de l’eau',mortality:'Mortalités',expenses:'Dépenses & stocks',harvest:'Récoltes',sales:'Ventes & clients',reports:'Trésorerie & rapports',settings:'Paramètres & sauvegarde',daily:'Journal du jour',weekly:'Programme du samedi',plan:'Plan d’alimentation'};
let page='dashboard';
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){editing=null;closeMenu();page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()}});
function card(title,body,extra=''){return `<section class="card ${extra}"><h3>${title}</h3>${body}</section>`}
function empty(text='Aucune donnée enregistrée.'){return `<div class="empty">${text}</div>`}
function table(headers,rows){if(!rows.length)return empty();return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function field(label,name,type='text',value='',opts=null,attrs=''){let input=type==='select'?`<select name="${name}" ${attrs}>${opts.map(o=>`<option value="${esc(o[0])}" ${String(value)===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" ${attrs}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}>`;return `<div class="field"><label>${label}</label>${input}</div>`}
let editing=null,dailyDate=dateNow(),feedPrefill=null,payPrefill=null;
function form(title,fields,submit,label='Enregistrer',arr=null){let on=arr&&isEd(arr);return `<form class="card ${on?'editing':''}" data-form="${submit}" ${on?`data-edit="${esc(editing.id)}"`:''}><h3>${on?'✏️ Modifier — ':''}${title}</h3><div class="formgrid">${fields}</div><div class="actions" style="margin-top:15px"><button class="btn primary" type="submit">${on?'Mettre à jour':label}</button>${on?'<button class="btn" type="button" onclick="cancelEdit()">Annuler</button>':'<button class="btn" type="reset">Réinitialiser</button>'}</div></form>`}
function ed(arr){return editing&&editing.arr===arr?(state[arr].find(x=>x.id===editing.id)||{}):{}}
function isEd(arr){return !!(editing&&editing.arr===arr&&state[arr].some(x=>x.id===editing.id))}
function dv(e,k,def){return e[k]!==undefined&&e[k]!==null?e[k]:def}
function rowActions(arr,id){return `<button class="btn sm" onclick="edit('${arr}','${id}')">Modifier</button> <button class="btn sm danger" onclick="del('${arr}','${id}')">Supprimer</button>`}
function recent(arr){return arr.map((x,i)=>[x,i]).sort((a,b)=>String(b[0].date||'').localeCompare(String(a[0].date||''))||b[1]-a[1]).map(p=>p[0])}
function paidOf(x){return (x.payments||[]).reduce((a,p)=>a+num(p.amount),0)}
function resteOf(x){return num(x.total)-paidOf(x)}
function totalPaid(){return state.sales.reduce((a,x)=>a+paidOf(x),0)}
function receivables(){return state.sales.reduce((a,x)=>a+Math.max(0,resteOf(x)),0)}
function cashBalance(){return num(state.config.budget)-sum(state.expenses,'amount')+totalPaid()}
function fkg(x){return x<1?Math.round(x*1000)+' g':x.toFixed(2).replace('.',',')+' kg'}
function fnum(x,d=1){return Number(x).toFixed(d).replace('.',',')}
function pondOptions(){return state.ponds.map(p=>[p.id,p.name])}
function dashboard(){
 let expenses=sum(state.expenses,'amount'),paid=totalPaid(),done=state.steps.filter(s=>s.done).length,today=dateNow();
 let mort7=state.mortalities.filter(x=>x.date&&daysBetween(x.date,today)>=0&&daysBetween(x.date,today)<=7).reduce((a,x)=>a+num(x.count),0);
 let alerts=[];
 if(!state.samples.length)alerts.push({text:'Échantillonnage non enregistré : ne fixe pas encore la ration ni la densité.'});
 if(!state.water.length)alerts.push({text:'Aucune mesure de qualité de l’eau enregistrée.'});
 if(mort7>0)alerts.push({text:`${mort7} mortalité(s) sur les 7 derniers jours : vérifier les causes et l’eau.`});
 if(expenses>num(state.config.budget))alerts.push({text:'Les dépenses enregistrées dépassent le budget initial.'});
 dailyAlerts(today).forEach(a=>alerts.push(a));
 let pend=pendingTasks(today),tot=0,dn=0;
 state.ponds.forEach(p=>DAILY.filter(t=>!t.global).forEach(t=>{let st=taskState(t,today,p.id);if(!t.every||st.due||st.done){tot++;if(st.done)dn++}}));
 DAILY.filter(t=>t.global).forEach(t=>{let st=taskState(t,today,'all');if(!t.every||st.due||st.done){tot++;if(st.done)dn++}});
 return `<div class="pagehead"><div><h2>Bonjour, bienvenue 👋</h2><div class="muted">Vue d’ensemble de ton exploitation à Ahoué.</div></div><div class="actions"><button class="btn primary" onclick="go('daily')">☀ Journal du jour</button><button class="btn soft" onclick="go('expenses')">+ Dépense</button><button class="btn soft" onclick="go('sampling')">+ Échantillonnage</button></div></div>
 ${alerts.map(a=>`<div class="alert ${a.urgent?'urgent':''}">${esc(a.text)}</div>`).join('')}

}

function sitePage(){
 let s=state.siteChecks||{};
 const opts=a=>a.map(v=>[v,v]);
 let fields=field('Type d’étang observé','pondType','select',s.pondType||'Inconnu',opts(['Inconnu','Étang creusé / en déblai','Étang de barrage','Étang en dérivation','Creusé et endigué']))+
 field('Origine de l’eau','waterSource','select',s.waterSource||'Inconnue',opts(['Inconnue','Pluie / ruissellement','Nappe / infiltration','Source','Cours d’eau / canal','Pompage','Mixte']))+
 field('Possibilité de vidange','drainage','select',s.drainage||'À vérifier',opts(['À vérifier','Vidange gravitaire complète','Vidange partielle','Vidange par pompage','Non vidangeable']))+
 field('Contrôle de l’alimentation en eau','waterControl','select',s.waterControl||'À vérifier',opts(['À vérifier','Contrôlable','Partiellement contrôlable','Non contrôlable']))+
 field('Entrée d’eau / grille anti-poissons','inlet','select',s.inlet||'À vérifier',opts(['À vérifier','Présente et fonctionnelle','Présente mais à réparer','Absente','Sans objet']))+
 field('Sortie / vidange et grille','outlet','select',s.outlet||'À vérifier',opts(['À vérifier','Présente et fonctionnelle','Présente mais à réparer','Absente','Sans objet']))+
 field('Trop-plein / évacuation des crues','overflow','select',s.overflow||'À vérifier',opts(['À vérifier','Présent et dégagé','Présent mais obstrué','Absent / à évaluer']))+
 field('État des digues','dikes','select',s.dikes||'À vérifier',opts(['À vérifier','Bon état apparent','Érosion / végétation à gérer','Affaissement / fissures','Fuite suspectée']))+
 field('Fuites / baisse du niveau','leaks','select',s.leaks||'À vérifier',opts(['À vérifier','Aucune fuite visible','Baisse inexpliquée','Fuite observée']))+
 field('Risque de crue / ruissellement','floodRisk','select',s.floodRisk||'À vérifier',opts(['À vérifier','Faible selon observation','À surveiller','Risque important / avis local nécessaire']))+
 field('Accès pour nourrir et récolter','access','select',s.access||'À vérifier',opts(['À vérifier','Bon accès','Accès limité','À améliorer']))+
 field('Relation entre les deux étangs','pondConnection','select',s.pondConnection||'À vérifier',opts(['À vérifier','Alimentation indépendante / parallèle','En chapelet (eau de A vers B ou inverse)','Connexion inconnue']))+
 field('Notes du diagnostic','notes','textarea',s.notes||'');
 let alerts=[];
 if((s.inlet||'').includes('Absente'))alerts.push('Évaluer une entrée protégée pour limiter l’entrée de poissons indésirables et la fuite des poissons élevés.');
 if((s.outlet||'').includes('Absente'))alerts.push('Évaluer un dispositif de vidange/récolte avant d’investir dans un cycle de production.');
 if((s.overflow||'').includes('Absent'))alerts.push('Faire évaluer une évacuation sûre des eaux excédentaires avant les fortes pluies.');
 if((s.dikes||'').includes('Fuite')||(s.leaks||'').includes('Fuite')||(s.leaks||'').includes('Baisse'))alerts.push('Priorité : rechercher la cause d’une fuite ou baisse anormale avant d’augmenter l’alimentation.');
 let rows=state.ponds.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.area} m²</td><td>${p.depth} m (saisie)</td><td>${Math.round(p.area*p.depth).toLocaleString('fr-FR')} m³</td></tr>`);
 return `<div class="pagehead"><div><h2>Diagnostic des ouvrages — principes FAO</h2><div class="muted">Maîtrise de l’eau, digues, évacuation, récolte et accès.</div></div><span class="pill">Diagnostic initial</span></div>
 <div class="alert">Inspection à réaliser sur place. Ce formulaire ne remplace pas un diagnostic technique. Évite les gros travaux sans évaluer le sol, les niveaux d’eau et le risque de crue.</div>
 <div class="grid two">${form('Fiche d’inspection du site',fields,'siteCheck','Enregistrer le diagnostic')}${card('Volumes théoriques indicatifs',`<p class="muted small">Calcul simplifié : surface en eau × profondeur moyenne estimée. La profondeur réelle varie souvent selon les zones de l’étang.</p>${table(['Étang','Surface','Profondeur saisie','Volume indicatif'],rows)}<div class="alert">Pour 200 m² et une profondeur moyenne supposée de 1 à 1,5 m, le volume géométrique serait de 200 à 300 m³ par étang. Ce n’est pas une mesure réelle et ce chiffre ne suffit pas à calculer une densité d’élevage.</div><div class="sectiontitle">Liste de contrôle inspirée de la FAO</div><ul><li>Digues sans érosion, affaissement ni fuite visible.</li><li>Entrée d’eau contrôlable et protégée si elle existe.</li><li>Sortie/vidange adaptée à une récolte maîtrisée, si le site le permet.</li><li>Évacuation sûre des excès d’eau et des crues.</li><li>Accès aux ouvrages pour nourrir, surveiller et récolter.</li><li>Si possible, alimentation indépendante des deux étangs pour limiter le transfert des problèmes d’un étang à l’autre.</li></ul><p class="footnote">Référence : FAO, <a href="https://www.fao.org/fishery/static/FAO_Training/FAO_Training/General/x6708f/x6708f01.htm" target="_blank" rel="noopener">Les étangs et leurs ouvrages</a>, sections sur les types d’étangs, profondeur et agencement.</p>`)}</div>
 ${alerts.map(a=>`<div class="alert">${esc(a)}</div>`).join('')}
 <p class="footnote">Le manuel FAO donne des principes généraux. Comme les étangs d’Ahoué existent déjà et sont remplis, la priorité est de diagnostiquer et de réparer seulement ce qui est nécessaire, sans lancer de gros travaux à l’aveugle.</p>`;
}


function guidePage(){
const items = [
 {title:'1. Confirmer les conditions du site',body:'Vérifier la disponibilité de l’eau en saison sèche et en saison des pluies, son origine, les risques de pollution, la température et la salinité. Le manuel indique qu’une température de 20 à 30 °C convient généralement à la pisciculture tropicale.'},
 {title:'2. Choisir un système adapté aux moyens',body:'L’Agrodok distingue les systèmes extensifs (peu d’intrants, forte dépendance aux aliments naturels) et semi-intensifs (aliments et/ou fertilisation supplémentaires). Le manuel se concentre surtout sur ces deux approches et décrit les systèmes intensifs comme plus coûteux et plus exigeants en oxygène et en gestion.'},
 {title:'3. Sécuriser les étangs existants avant d’investir',body:'Inspecter les digues, les fuites, les entrées et sorties d’eau, les filtres, le trop-plein et les risques de ruissellement. Le manuel recommande de protéger les digues contre l’érosion et d’éviter que les eaux de ruissellement chargées de boue ou de polluants entrent directement dans l’étang.'},
 {title:'4. Identifier les poissons avant le repeuplement',body:'Sélectionner les espèces selon la demande locale, la croissance, la reproduction en captivité, la disponibilité d’alevins, les aliments accessibles et la résistance aux maladies. Le manuel conseille, lorsque c’est possible, de privilégier les espèces locales et de ne pas introduire d’espèces sans évaluation préalable.'},
 {title:'5. Estimer la biomasse et décider de la ration',body:'Échantillonner les poissons, les compter dans l’échantillon, les mesurer et les peser. Ne pas calculer une ration ou une densité fiable à partir d’un simple nombre approximatif de poissons : il faut connaître au minimum l’espèce et le poids moyen.'},
 {title:'6. Suivre l’eau et prévenir le manque d’oxygène',body:'Observer les poissons tôt le matin et noter température, pH, oxygène dissous si un appareil est disponible, transparence, couleur et odeur. Le manuel indique que l’oxygène est souvent au plus bas en début de matinée. Des poissons qui pipent l’air à la surface constituent un signal d’urgence.'},
 {title:'7. Nourrir avec prudence',body:'Distinguer aliments naturels de l’étang et aliments supplémentaires. Consigner chaque distribution et son coût. Éviter les apports excessifs d’aliments ou de fertilisants : leur décomposition et une forte densité de poissons peuvent provoquer un manque d’oxygène.'},
 {title:'8. Tester le périphyton seulement à petite échelle',body:'Des tiges de bambou ou des branches immergées peuvent développer du périphyton, source de nourriture naturelle et d’abri. Le résultat dépend de l’espèce, de la qualité de l’eau et de la quantité de substrat. Le manuel signale aussi des besoins de main-d’œuvre et des risques si des matériaux organiques se décomposent. Tester dans une zone limitée et suivre l’eau avant d’étendre.'},
 {title:'9. Préparer la récolte et la conservation',body:'Planifier la récolte et la destination du poisson. Le poisson frais se détériore rapidement sous climat tropical : utiliser une hygiène rigoureuse et prévoir une vente rapide, de la glace si disponible ou une transformation adaptée comme le fumage, le salage ou le séchage.'}
];
return `<div class="pagehead"><div><h2>Guide technique — Agrodok 15</h2><div class="muted">Repères pratiques issus du document « La pisciculture à petite échelle en eau douce » (Agromisa/CTA, 2008), adaptés au diagnostic de tes deux étangs existants à Ahoué.</div></div></div>
<div class="alert">Important : ce guide est un support de décision, pas un diagnostic sur place. Les recommandations de densité, de ration, de fertilisation et de traitement dépendent de l’espèce, de la biomasse et de la qualité réelle de l’eau.</div>
<div class="grid two">
${card('Priorités recommandées pour Ahoué',`<ol><li>Inspecter les digues, les fuites et les dispositifs de trop-plein.</li><li>Identifier les espèces sauvages présentes.</li><li>Faire un échantillonnage comparable dans chaque étang et peser les poissons.</li><li>Mesurer ou faire mesurer la qualité de l’eau.</li><li>Établir un budget des besoins avant tout achat d’alevins ou d’aliments.</li></ol><p class="footnote">Avec le budget initial limité, privilégier une conduite extensive ou semi-intensive prudente avant d’envisager une intensification.</p>`)}
${card('Repères de qualité de l’eau du manuel',`<ul><li><b>Température :</b> 20–30 °C généralement favorable aux espèces d’eau douce tropicales.</li><li><b>pH :</b> intervalle préférentiel indiqué dans le manuel : 6,7–8,6.</li><li><b>Oxygène :</b> surveiller surtout tôt le matin ; les poissons qui viennent respirer en surface nécessitent une réaction immédiate.</li><li><b>Transparence :</b> mesurer si possible avec un disque de Secchi et interpréter avec la couleur de l’eau et le comportement des poissons.</li></ul><p class="footnote">Ces repères sont généraux et ne remplacent pas les exigences spécifiques de l’espèce élevée.</p>`)}
</div>
<div class="grid two" style="margin-top:16px">
${card('Checklist terrain',`<p class="muted small">Coche les vérifications effectuées. Tes coches sont enregistrées avec tes données ; enregistre les constats détaillés dans les modules correspondants.</p><div id="agroChecklist">${items.map((it,i)=>`<label class="step" style="cursor:pointer"><input type="checkbox" data-agro-check="${i}" ${state.agro&&state.agro[i]?'checked':''} onchange="toggleAgro(${i})" style="margin-top:4px"><div class="stepmain"><strong>${it.title}</strong><p>${it.body}</p></div></label>`).join('')}</div>`)}
${card('Points techniques à retenir',`<ul><li>Un étang de taille modérée est plus facile à surveiller qu’un grand bassin ; le document cite environ 300 m² comme taille adaptée à un étang familial, mais le choix dépend du terrain et des ressources.</li><li>La capacité de vidange facilite une récolte maîtrisée, mais ne modifie pas les ouvrages existants sans diagnostic professionnel.</li><li>Les entrées et sorties d’eau doivent être protégées par des filtres pour limiter l’entrée de poissons indésirables et la fuite des poissons élevés.</li><li>Le manuel recommande de nettoyer les filtres quotidiennement lorsqu’ils sont installés.</li><li>Éviter d’appliquer chaux, fumier, engrais ou produits de traitement sans connaître le sol, le pH, la qualité de l’eau et les besoins de l’espèce.</li></ul>`)}
</div>
<div class="card" style="margin-top:16px"><h3>Référence documentaire</h3><p><b>Eira Carballo, Assiah van Eer, Ton van Schie et Aldin Hilbrands.</b> <i>La pisciculture à petite échelle en eau douce</i>, Agrodok 15, Fondation Agromisa et CTA, édition 2008.</p><p class="footnote">Les informations de cette page sont tirées du document fourni, notamment des chapitres 2 à 4, 6 à 9 et des annexes. Les seuils et exemples du manuel sont des repères généraux : ils ne constituent pas des objectifs de production garantis pour les étangs d’Ahoué.</p></div>`;
}

function lastDone(key,upTo){let ds=Object.keys(state.daily).filter(d=>d<=upTo&&((state.daily[d]||{}).checks||{})[key]).sort();return ds.length?ds[ds.length-1]:null}
function taskState(t,date,pond){
 let key=pond+'|'+t.id,manual=!!(((state.daily[date]||{}).checks||{})[key]);
 let auto=t.auto?!!t.auto(date,pond):false,done=manual||auto;
 let lasts=[lastDone(key,date)];if(t.last)lasts.push(t.last(date,pond));
 let last=lasts.filter(Boolean).sort().pop()||null,age=last?daysBetween(last,date):null;
 let due=true;if(t.every&&!done)due=last===null||age>=t.every;

const CP=[['','À évaluer'],['go','✅ Validé'],['reserve','⚠️ Validé avec réserves'],['stop','⛔ Non validé']];
let wkOpen={};
function addDays(d,n){return new Date(new Date(d+'T00:00:00Z').getTime()+n*86400000).toISOString().slice(0,10)}
function nextSat(d){let dow=new Date(d+'T00:00:00Z').getUTCDay();return addDays(d,(6-dow+7)%7)}
function satStart(){if(!state.weekly.start){state.weekly.start=nextSat(dateNow());persist()}return state.weekly.start}
function weekDate(n){return addDays(satStart(),(n-1)*7)}
function curWeek(){let t=dateNow();for(const w of WEEKS){if(weekDate(w.n)>=t)return w.n}return WEEKS.length+1}
function weekMin(w){return w.tasks.reduce((a,t)=>a+t.min,0)}
function fmtH(m){let h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+String(r).padStart(2,'0'):'')}
function weekDone(w){return w.tasks.filter((t,i)=>state.weekly.done[w.n+'|'+i]).length}
function cpOf(n){return (state.weekly.cp||{})[n]||{status:'',notes:''}}
function cpBadge(s){return s==='go'?'<span class="badge ok">Validé</span>':s==='reserve'?'<span class="badge todo">Réserves</span>':s==='stop'?'<span class="badge late">Non validé</span>':'<span class="badge">À évaluer</span>'}
function toggleWk(n,i){let k=n+'|'+i;if(state.weekly.done[k])delete state.weekly.done[k];else state.weekly.done[k]=true;save()}
function setCp(n,field,v){state.weekly.cp=state.weekly.cp||{};let c=state.weekly.cp[n]=state.weekly.cp[n]||{status:'',notes:''};c[field]=v;if(field==='status')save();else persist()}
function setWeeklyStart(v){if(!v)return;state.weekly.start=v;if(new Date(v+'T00:00:00Z').getUTCDay()!==6)toast('Attention : cette date n’est pas un samedi');save()}
function calcN(){let a=num(document.getElementById('c1').value),b=num(document.getElementById('c2').value),el=document.getElementById('nres');
 if(a>0&&b>=0&&a>b)el.innerHTML='Effectif estimé ≈ <b>'+Math.round(a*a/(a-b))+'</b> poissons (C1² ÷ (C1 − C2)).';
 else if(a>0&&b>=a)el.textContent='Le 2e passage doit capturer moins de poissons que le 1er : refais un échantillonnage avec le même effort, ou utilise une estimation prudente.';
 else el.textContent='Saisis C1 et C2.'}
function printRoutine(){document.body.classList.add('pr-routine');window.print();setTimeout(()=>document.body.classList.remove('pr-routine'),500)}
function weekCard(w,cur){let sat=weekDate(w.n),dn=weekDone(w),tot=w.tasks.length,cp=cpOf(w.n),past=sat<dateNow();
 let st=w.n===cur?'<span class="badge todo">Prochain samedi</span>':(past?(dn===tot?'<span class="badge ok">Terminée</span>':'<span class="badge late">En retard</span>'):'');
 let open=wkOpen[w.n]!==undefined?wkOpen[w.n]:w.n===cur;
 return `<details class="wk" ${open?'open':''} ontoggle="wkOpen[${w.n}]=this.open"><summary><strong>S${w.n} — ${sat}</strong><span>${esc(w.title)}</span>${st}<span class="badge">${dn}/${tot} tâches • ≈ ${fmtH(weekMin(w))}</span>${cpBadge(cp.status)}</summary><div class="wkbody"><p class="muted small">${esc(w.phase)} — <b>Objectif :</b> ${esc(w.goal)}</p>
 ${w.tasks.map((t,i)=>{let d=!!state.weekly.done[w.n+'|'+i];return `<div class="step"><button class="check ${d?'done':''}" onclick="toggleWk(${w.n},${i})">${d?'✓':''}</button><div class="stepmain"><strong>${esc(t.t)}</strong><p>≈ ${t.min} min</p></div><div class="taskside">${t.go?`<button class="btn sm soft" onclick="go('${t.go}')">Ouvrir →</button>`:''}</div></div>`}).join('')}
 <div class="alert ${cp.status==='stop'?'urgent':cp.status==='go'?'good':''}" style="margin-top:14px"><b>Point de contrôle S${w.n}</b> — pour passer à la suite :<ul style="margin:6px 0">${w.cp.criteria.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div><b>Sinon :</b> ${esc(w.cp.ifNot)}</div></div>
 <div class="formgrid"><div class="field"><label>Résultat du point de contrôle</label><select onchange="setCp(${w.n},'status',this.value)">${CP.map(o=>`<option value="${o[0]}" ${cp.status===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div><div class="field"><label>Entre ce samedi et le suivant</label><div class="muted small">${esc(w.between)}</div></div><div class="field full"><label>Notes du samedi (constats, décisions, mesures)</label><textarea onchange="setCp(${w.n},'notes',this.value)">${esc(cp.notes||'')}</textarea></div></div></div></details>`}
function weeklyPage(){let cur=curWeek(),start=satStart();
 let rows=WEEKS.map(w=>`<tr><td><b>S${w.n}</b></td><td>${weekDate(w.n)}</td><td>${esc(w.phase.replace(/^Phase \d — /,''))}</td><td>${esc(w.title)}</td><td>${weekDone(w)}/${w.tasks.length}</td><td>≈ ${fmtH(weekMin(w))}</td><td>${cpBadge(cpOf(w.n).status)}</td></tr>`);
 let blank='<tr class="blank"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(7);
 let routine=`<section class="card" id="routine"><h3>Fiche de routine pour la semaine (à imprimer et remettre à la personne qui s’occupe des étangs)</h3>
 <div class="sectiontitle">Semaines 1 à 4 (avant l’alimentation) — 5 minutes par jour</div><ul><li>Regarder la surface de chaque étang : des poissons qui pipent l’air ?</li><li>Le niveau d’eau est-il sous le repère ?</li><li>Compter et retirer les poissons morts.</li></ul>
 <div class="sectiontitle">À partir de la semaine 5 (alimentation lancée) — 20 à 30 minutes par jour</div><p class="small"><b>Matin, avant de nourrir :</b></p><ol><li>Regarder chaque étang : <b>si des poissons sont en surface, ne pas nourrir et prévenir tout de suite.</b></li><li>Niveau d’eau comparé au repère ; retirer et compter les poissons morts.</li><li>Nettoyer les grilles et filtres.</li><li>Premier repas : une mesure marquée, donnée en 2 ou 3 fois.</li><li>Rester 15 à 20 minutes : tout est-il mangé ? Noter les refus.</li></ol><p class="small"><b>Soir :</b></p><ol><li>Deuxième repas (si prévu), même méthode.</li><li>Ronde : digues, trous, traces de prédateurs, vols.</li><li>Noter dans le carnet ci-dessous.</li></ol>
 <p class="small"><b>En cas de problème, appeler :</b> ______________________________</p>
 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Étang</th><th>Repas</th><th>Quantité</th><th>Refus ?</th><th>Morts</th><th>Observations</th></tr></thead><tbody>${blank}</tbody></table></div>
 <div class="actions no-print" style="margin-top:12px"><button class="btn primary" onclick="printRoutine()">Imprimer la fiche</button></div><p class="footnote">Le samedi, recopie le carnet dans l’application (Alimentation, Mortalités, Journal du jour).</p></section>`;
 let est=`<section class="card"><h3>Estimateur d’effectif (2 passages)</h3><p class="muted small">Pêche deux fois avec le même effort, sans remettre à l’eau les poissons du 1er passage. Saisis le nombre de poissons de chaque passage.</p><div class="formgrid"><div class="field"><label>Poissons au passage 1 (C1)</label><input id="c1" type="number" min="0" oninput="calcN()"></div><div class="field"><label>Poissons au passage 2 (C2)</label><input id="c2" type="number" min="0" oninput="calcN()"></div></div><p id="nres" style="margin-top:12px">Saisis C1 et C2.</p><p class="footnote">Estimation grossière : elle suppose le même effort et la même facilité de capture aux deux passages. Reporte le résultat dans la fiche de l’étang comme estimation, pas comme comptage exact.</p></section>`;
 return `<div class="pagehead"><div><h2>Programme du samedi</h2><div class="muted">12 samedis pour diagnostiquer, lancer, suivre et vendre, avec un point de contrôle à chaque étape.</div></div><div class="actions"><label class="small muted" style="align-self:center">1er samedi :</label><input type="date" value="${start}" onchange="setWeeklyStart(this.value)" style="border:1px solid #cfdcd4;border-radius:9px;padding:8px"></div></div>
 <div class="alert">Ce programme suppose que tu es disponible le samedi seulement : chaque samedi demande environ 3 à 4 heures. Les semaines 1 à 4 (diagnostic) ne demandent qu’un passage de 5 minutes en semaine. <b>À partir de la semaine 5, nourrir demande une personne chaque jour</b> (fiche de routine plus bas). Les dates de récolte (semaines 10 et 11) sont indicatives : elles dépendent de la taille des poissons mesurée aux pesées.</div>
 <div class="grid stats">${stat('Prochain samedi',cur>WEEKS.length?'Terminé':'S'+cur,cur>WEEKS.length?'Fais le bilan':weekDate(cur))}${stat('Tâches faites',WEEKS.reduce((a,w)=>a+weekDone(w),0)+' / '+WEEKS.reduce((a,w)=>a+w.tasks.length,0),'sur 12 samedis')}${stat('Points validés',WEEKS.filter(w=>cpOf(w.n).status==='go').length+' / '+WEEKS.length,'points de contrôle')}${stat('Durée par samedi','3 à 4 h','selon la semaine')}</div>
 ${card('Vue d’ensemble',table(['Semaine','Date','Phase','Thème','Tâches','Durée','Contrôle'],rows))}
 <div style="margin-top:16px">${WEEKS.map(w=>weekCard(w,cur)).join('')}</div>
 <div class="grid two" style="margin-top:16px">${routine}${est}</div>
 <p class="footnote" style="margin-top:12px">Le programme est un cadre : adapte-le aux résultats des points de contrôle. Si un point n’est pas validé, ne passe pas à la semaine suivante et reporte les tâches (ou décale le 1er samedi). Les repères techniques sont indicatifs ; fais-les valider par un technicien local.</p>`}
function weeklyDashCard(){let cur=curWeek();
 if(cur>WEEKS.length)return card('Programme du samedi','<div class="empty">Les 12 samedis sont passés : fais le bilan puis planifie le cycle suivant.</div><button class="btn" onclick="go(\'weekly\')">Ouvrir le programme →</button>');
 let w=WEEKS[cur-1],dn=weekDone(w),tot=w.tasks.length,warn=[];
 if(cur>1){let p=cpOf(cur-1);if(p.status==='stop'||p.status==='reserve')warn.push(`Point de contrôle S${cur-1} : ${p.status==='stop'?'non validé':'validé avec réserves'} — à régler avant d’avancer.`)}
 let late=WEEKS.filter(x=>x.n<cur&&weekDone(x)<x.tasks.length).length;if(late)warn.push(`${late} samedi(s) précédent(s) avec des tâches non terminées.`);
 return card(`Prochain samedi — ${weekDate(cur)} (S${cur})`,`${warn.map(x=>`<div class="alert">${esc(x)}</div>`).join('')}<strong>${esc(w.title)}</strong><p class="muted small">${esc(w.goal)}</p><div style="display:flex;justify-content:space-between;margin:8px 0"><span class="muted small">${dn}/${tot} tâches • ≈ ${fmtH(weekMin(w))}</span><strong>${Math.round(dn/tot*100)}%</strong></div><div class="progress"><span style="width:${dn/tot*100}%"></span></div><button class="btn primary" style="margin-top:12px" onclick="go('weekly')">Ouvrir le programme →</button>`)}
function go(p){editing=null;closeMenu();page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();window.scrollTo(0,0)}
function render(){document.getElementById('topTitle').textContent=titles[page]||titles.dashboard;let v=document.getElementById('view');v.innerHTML=({dashboard,daily:dailyPage,weekly:weeklyPage,steps:stepsPage,ponds:pondsPage,site:sitePage,guide:guidePage,sampling:samplingPage,plan:planPage,feeding:feedingPage,water:waterPage,mortality:mortalityPage,expenses:expensesPage,harvest:harvestPage,sales:salesPage,reports:reportsPage,settings:settingsPage}[page]||dashboard)();bindForms()}
function toggleStep(i){state.steps[i].done=!state.steps[i].done;save()}
function toggleAgro(i){state.agro[i]=!state.agro[i];persist()}
function edit(arr,id){editing={arr,id};render();window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(){editing=null;render()}
function del(arr,id){
 let msg='Supprimer cet enregistrement ?';
 if(arr==='feedings'&&state.expenses.some(x=>x.feedId===id))msg+='\n(La dépense liée à cette distribution sera aussi supprimée.)';
 if(arr==='sales')msg='Supprimer cette vente et tous ses paiements ?';
 if(!confirm(msg))return;
 if(arr==='feedings')state.expenses=state.expenses.filter(x=>x.feedId!==id);
 if(arr==='expenses'){let x=state.expenses.find(y=>y.id===id);if(x&&x.feedId){let f=state.feedings.find(z=>z.id===x.feedId);if(f)f.cost=0}}
 state[arr]=state[arr].filter(x=>x.id!==id);
 if(editing&&editing.id===id)editing=null;
 save();toast('Enregistrement supprimé')}
function bindForms(){document.querySelectorAll('form[data-form]').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();
 let d=Object.fromEntries(new FormData(f).entries()),kind=f.dataset.form,eid=f.dataset.edit||null;
 const opt=k=>(d[k]===''||d[k]===undefined)?null:num(d[k]);
 const upsert=(arr,rec)=>{if(eid){let o=state[arr].find(x=>x.id===eid);if(o)Object.assign(o,rec)}else state[arr].push({id:uid(),...rec})};
 if(kind==='config'){state.config={...state.config,name:d.name,owner:d.owner,budget:num(d.budget),startDate:d.startDate,notes:d.notes};}
 else if(kind==='siteCheck'){state.siteChecks={...state.siteChecks,...d};}
 else if(kind==='editPond'){let p=state.ponds.find(x=>x.id===f.dataset.id);if(p)Object.assign(p,{name:d.name,area:num(d.area),depth:num(d.depth),stockEstimate:num(d.stockEstimate),species:d.species,status:d.status,notes:d.notes});}
 else if(kind==='sample'){
  if(num(d.measured)>num(d.caught)){alert('Le nombre mesuré/pesé ne peut pas dépasser le nombre capturé.');return}
  upsert('samples',{...d,caught:num(d.caught),measured:num(d.measured),weight:num(d.weight),length:num(d.length)});}
 else if(kind==='feeding'){
  if(num(d.kg)<=0){alert('La quantité distribuée doit être supérieure à 0.');return}
  let rec={...d,kg:num(d.kg),cost:num(d.cost)},id;
  if(eid){upsert('feedings',rec);id=eid}else{id=uid();state.feedings.push({id,...rec})}
  let ex=state.expenses.find(x=>x.feedId===id);
  if(rec.cost>0){let er={date:rec.date,category:'Alimentation',item:'Aliment distribué ('+rec.pond+')',quantity:rec.kg,amount:rec.cost,supplier:'',notes:'Ajouté depuis le module alimentation',feedId:id};if(ex)Object.assign(ex,er);else state.expenses.push({id:uid(),...er})}
  else if(ex){state.expenses=state.expenses.filter(x=>x!==ex)}}
 else if(kind==='water'){upsert('water',{...d,temp:opt('temp'),ph:opt('ph'),oxygen:opt('oxygen')});}
 else if(kind==='mortality'){if(num(d.count)<1){alert('Indique au moins 1 poisson.');return}upsert('mortalities',{...d,count:num(d.count)});}
 else if(kind==='expense'){upsert('expenses',{...d,amount:num(d.amount),quantity:num(d.quantity)});}
 else if(kind==='stock'){
  let rec={...d,qty:num(d.qty),threshold:num(d.threshold)};
  if(eid)upsert('stockItems',rec);
  else{let old=state.stockItems.find(x=>x.name.toLowerCase()===d.name.toLowerCase());if(old)Object.assign(old,rec);else state.stockItems.push({id:uid(),...rec})}}
 else if(kind==='harvest'){upsert('harvests',{...d,kg:num(d.kg),count:num(d.count)});}
 else if(kind==='client'){
  if(eid){let old=state.clients.find(x=>x.id===eid);if(old&&old.name!==d.name)state.sales.forEach(s=>{if(s.client===old.name)s.client=d.name})}
  upsert('clients',{...d});}
 else if(kind==='sale'){
  let kg=num(d.kg),price=num(d.price),total=kg*price;
  if(kg<=0||price<=0){alert('La quantité et le prix doivent être supérieurs à 0.');return}
  if(eid){let o=state.sales.find(x=>x.id===eid);if(o&&paidOf(o)>total+0.001){alert('Le nouveau total est inférieur aux paiements déjà reçus ('+money(paidOf(o))+'). Corrige d’abord les paiements.');return}
   if(o)Object.assign(o,{date:d.date,client:d.client,product:d.product,kg,price,total,notes:d.notes});}
  else{let paid=d.paid===''?total:num(d.paid);if(paid>total+0.001){alert('Le montant encaissé dépasse le total de la vente.');return}
   state.sales.push({id:uid(),date:d.date,client:d.client,product:d.product,kg,price,total,notes:d.notes,payments:paid>0?[{id:uid(),date:d.date,amount:paid,method:'',note:'Encaissement à la vente'}]:[]})}}
 else if(kind==='payment'){
  let s=state.sales.find(x=>x.id===d.sale);if(!s){alert('Choisis une vente à solder.');return}
  let a=num(d.amount);if(a<=0){alert('Le montant doit être supérieur à 0.');return}
  if(a>resteOf(s)+0.001){alert('Le montant dépasse le reste à encaisser ('+money(resteOf(s))+').');return}
  s.payments.push({id:uid(),date:d.date,amount:a,method:d.method,note:d.notes});payPrefill=null;}
 else if(kind==='feedPrice'){state.config.feedPrice=num(d.feedPrice);}
 else if(kind==='group'){if(num(d.count)<0){alert('Effectif invalide.');return}upsert('groups',{pond:d.pond,species:d.species,count:num(d.count),avgWeight:num(d.avgWeight),notes:d.notes});}
 else if(kind==='obs'){let dt=f.dataset.date,pd=f.dataset.pond;let day=state.daily[dt]=state.daily[dt]||{checks:{},obs:{}};day.obs=day.obs||{};day.obs[pd]={...d};}
 editing=null;save();toast(eid?'Modification enregistrée':'Données enregistrées');}));}
function toggleMenu(){let n=document.getElementById('nav'),o=n.classList.toggle('open');document.getElementById('menuBtn').textContent=o?'✕':'☰'}
function closeMenu(){let n=document.getElementById('nav'),b=document.getElementById('menuBtn');if(n)n.classList.remove('open');if(b)b.textContent='☰'}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)}
async function saveFile(content,name,type){
 if(isIOS()&&navigator.canShare&&navigator.share){try{let f=new File([content],name,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}}
 downloadBlob(new Blob([content],{type}),name);return true}
async function backup(){let prev=state.lastBackup;state.lastBackup=new Date().toISOString();let json=JSON.stringify(state,null,2);
 let ok=await saveFile(json,'pisciculture-ahoue-sauvegarde-'+dateNow()+'.json','application/json');
 if(!ok)state.lastBackup=prev;persist();render();if(ok)toast('Sauvegarde créée')}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let s=JSON.parse(r.result);if(!s.config||!s.ponds)throw new Error('format');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){state=migrate({...structuredClone(defaultState),...s,config:{...defaultState.config,...s.config}});save();toast('Sauvegarde restaurée')}}catch(err){alert('Fichier invalide ou incompatible.')}e.target.value=''};r.readAsText(file)}
function exportCSV(){let lines=[['Type','Date','Étang/Client','Détail','Quantité','Montant FCFA']];
 state.expenses.forEach(x=>lines.push(['Dépense',x.date,'',x.category+' - '+x.item,x.quantity,x.amount]));
 state.feedings.forEach(x=>lines.push(['Alimentation',x.date,x.pond,(x.meal?x.meal+' - ':'')+x.type+' ('+x.consumption+')',x.kg,x.cost]));
 state.sales.forEach(x=>{lines.push(['Vente',x.date,x.client,x.product,x.kg,x.total]);(x.payments||[]).forEach(p=>lines.push(['Paiement',p.date,x.client,'Encaissement '+(p.method||''),'',p.amount]))});
 state.harvests.forEach(x=>lines.push(['Récolte',x.date,x.pond,x.destination,x.kg,'']));
 state.mortalities.forEach(x=>lines.push(['Mortalité',x.date,x.pond,x.cause,x.count,'']));
 state.samples.forEach(x=>lines.push(['Échantillonnage',x.date,x.pond,'Poids moyen '+(x.weight&&x.measured?(num(x.weight)/num(x.measured)).toFixed(1)+' g':'—'),x.measured,'']));
 state.water.forEach(x=>lines.push(['Qualité eau',x.date,x.pond,'T°C '+(x.temp??'')+' | pH '+(x.ph??'')+' | O2 '+(x.oxygen??'')+' | '+x.appearance,'','']));
 Object.keys(state.daily).sort().forEach(d=>Object.entries((state.daily[d]||{}).obs||{}).forEach(([p,o])=>lines.push(['Observation',d,p,[o.behavior,o.level,o.color,o.weather,o.notes].filter(Boolean).join(' | '),'',''])));
 let csv='﻿'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');saveFile(csv,'rapport-pisciculture-ahoue-'+dateNow()+'.csv','text/csv;charset=utf-8')}
function downloadBlob(blob,name){let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function resetData(){if(confirm('Effacer toutes les données et revenir aux valeurs initiales ?')){state=structuredClone(defaultState);save();toast('Application réinitialisée')}}
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
